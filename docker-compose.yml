version: '3.8'

services:
  ai-hedge-fund-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${AI_HEDGE_FUND_IMAGE:-ai-hedge-fund-api:latest}
    container_name: nice_jemison
    restart: always
    ports:
      - "6000:6000"
    env_file:
      - .env
    environment:
      BACKTEST_RUN_DB: /app/instance/backtest_runs.sqlite3
    volumes:
      - ./src:/app/src
      - ./webui2.py:/app/webui2.py
      - ./static:/app/static
      - ./data:/app/data
      - ./instance:/app/instance
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - hedge-fund-net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.45
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    networks:
      - hedge-fund-net

networks:
  hedge-fund-net:
    driver: bridge
